global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: shop
    static_configs: [{ targets: ["shop:8000"] }]
  - job_name: payments
    static_configs: [{ targets: ["payments:8000"] }]
