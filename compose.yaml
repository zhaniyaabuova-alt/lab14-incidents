name: shoplab
services:
  shop:
    build: ./app
    image: shoplab-app:1
    environment: { SERVICE: shop, APP_VERSION: "1.0.0" }
    ports: ["127.0.0.1:8000:8000"]
  payments:
    image: shoplab-app:1
    environment: { SERVICE: payments, APP_VERSION: "${PAYMENTS_VERSION:-1.0.0}" }
  traffic:
    image: shoplab-app:1
    command: ["python", "-u", "traffic.py"]
  prometheus:
    image: prom/prometheus:v3.16.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-lifecycle]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["127.0.0.1:9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.35.0
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:9093:9093"]
  webhook:
    image: python:3.12-slim
    command: ["python", "-u", "/receiver.py"]
    volumes: ["./monitoring/receiver.py:/receiver.py:ro"]
  loki:
    image: grafana/loki:3.6.22
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./monitoring/loki.yml:/etc/loki/loki.yml:ro"]
    ports: ["127.0.0.1:3100:3100"]
  alloy:
    image: grafana/alloy:v1.22.0
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local lab only: no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
